version: 2
updates:
  # Cooldowns match min-release-age in .npmrc so Dependabot never proposes a version npm would refuse.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development

  # Keeps the workflow actions and their actions.lock pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
